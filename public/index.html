<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV Proxy</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #uv-root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="uv-root"></div>

  <script>
    function encode(url) {
      return btoa(unescape(encodeURIComponent(url)));
    }

    const urlParam = new URLSearchParams(location.search).get("u");

    if (!urlParam) {
      document.body.innerHTML = `<div id="uv-root">
        <h2 style="color: white; text-align: center;">Missing ?u= param</h2>
      </div>`;
      throw new Error("Missing ?u=");
    }

    // Initialize the proxy
    const script = document.createElement('script');
    script.src = './uvaddon.js';
    script.onload = () => {
      // The proxy will handle everything from here
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
