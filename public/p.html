<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultraviolet Proxy</title>
  <script src="/uv/uv.bundle.js" defer></script>
  <script src="/uv/uv.config.js" defer></script>
  <script src="/uv/uv.client.js" defer></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #101010;
    }
    #uv-root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1e1e1e;
    }
  </style>
</head>
<body>
  <div id="uv-root"></div>

  <script type="module">
    import { encode } from "/encode.js"; // Path to encoding logic

    const params = new URLSearchParams(location.search);
    const urlParam = params.get("u");

    if (!urlParam) {
      document.body.innerHTML = `<h2 style="color:white;text-align:center;">Missing ?u= param</h2>`;
      throw new Error("Missing ?u=");
    }

    try {
      // Encode the URL
      const encoded = __uv$config.prefix + btoa(unescape(encodeURIComponent(urlParam)));
      console.log("Encoded URL:", encoded);

      // Fetch the content of the URL
      fetch(encoded)
        .then(response => response.text())
        .then(html => {
          // Insert the content into the UV root div
          document.getElementById("uv-root").innerHTML = html;
        })
        .catch(err => {
          console.error("Error loading page:", err);
          document.body.innerHTML = `<h2 style="color:white;text-align:center;">Failed to load page</h2>`;
        });
    } catch (err) {
      console.error("Encoding Error:", err);
      document.body.innerHTML = `<h2 style="color:white;text-align:center;">Encoding error</h2>`;
    }
  </script>
</body>
</html>
